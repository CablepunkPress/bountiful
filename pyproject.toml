[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bountiful"
dynamic = ["version"]
description = "Bountiful: local AI agents on your own machine"
requires-python = ">=3.14"
dependencies = [
    "basic-bot @ git+https://github.com/CablepunkPress/basic-bot.git@main",
    "basic-ui @ git+https://github.com/CablepunkPress/basic-ui.git@main",
    "extend-a-bot @ git+https://github.com/CablepunkPress/extend-a-bot.git@main",
]

[project.scripts]
bountiful = "bountiful.command:main"

[tool.pyright]
pythonVersion = "3.14"

[tool.setuptools.dynamic]
version = {attr = "bountiful.__version__"}

[tool.setuptools.packages.find]
include = ["bountiful*"]