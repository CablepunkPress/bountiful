# Agent Configuration
# All values below can be changed. Restart the agent for changes to take effect.


# --- Server ---

# Port the chat UI runs on
flask_port = 11555


# --- Inference ---

# Provider: "local" (llama.cpp on your machine) or "claude" (Anthropic API)
# Claude requires an API key via add_secrets.py.
inference_provider = "local"

# Default chat model
#
# Local models (served by llama-server on your GPU):
#   "qwen3-8b-q4_k_m"   — 8B pure transformer, ~5GB, fits most GPUs
#   "qwen3-8b-q8_0"     — 8B pure transformer, ~8.5GB, higher quality
#
# Claude models (requires inference_provider = "claude"):
#   "claude-haiku-4-5-20251001"   — fast and affordable
#   "claude-sonnet-4-6"           — balanced
#   "claude-opus-4-6"             — most capable
#
default_model = "qwen3-8b-q4_k_m"

# Maximum tokens the model can generate per response
max_tokens = 4096
