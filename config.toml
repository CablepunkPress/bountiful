# Agent Configuration
# All values below can be changed. Restart the agent for changes to take effect.


# --- Server ---

# Port the chat UI runs on
flask_port = 11555


# --- Inference ---

# Provider: "local" (llama.cpp on your machine) or "claude" (Anthropic API)
# Local requires a GPU and a downloaded model. Claude requires an API key.
inference_provider = "claude"

# Model to load at startup
#
# Local models (served by llama-server on your GPU):
#   "qwen3-8b"           — 8B dense, fits most GPUs, good general use
#   "qwen3.6-35b-a3b"    — 35B MoE, needs 12GB+ VRAM and 32GB+ RAM
#
# Claude models (via Anthropic API):
#   "claude-haiku-4-5-20251001"   — fast and affordable
#   "claude-sonnet-4-6"           — balanced
#   "claude-opus-4-6"             — most capable
#
# Must match the provider above. Local models need the GGUF downloaded
# to ~/.bountiful/models/ first.
default_model = "claude-haiku-4-5-20251001"

# Maximum tokens the model can generate per response
max_tokens = 4096
